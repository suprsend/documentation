StylesPath = styles
MinAlertLevel = suggestion

Packages = Google, proselint, write-good, alex

[formats]
mdx = md

[*.mdx]
BasedOnStyles = Google, proselint, write-good, alex
CommentDelimiters = {/*, */}

TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>)

BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})