page: docs/multi-lingual-template.mdx
goal: Add a French language variant to an existing email template
steps:
  - goto: /en/${workspace}/templates
  - expect: {role: heading, name: "Templates"}
  - click: {role: link, name: "${workflow_slug}"}
  - expect: {text: "All Variants"}
  - click: {role: button, name: "+", within: {text: "All Variants"}}
  - click: {text: "New Variant", exact: true}
  - expect: {text: "Create Variant"}
  - fill: {target: {label: "ID"}, value: "default-fr"}
  - select: {target: {label: "Locale"}, value: "French"}
  - screenshot:
      out: images/multi-lingual-template/create-variant-locale-french.png
      element: {role: dialog}
      highlight: {label: "Locale"}
      alt: Create Variant modal with ID default-fr and Locale set to French
