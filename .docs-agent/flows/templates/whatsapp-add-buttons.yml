page: docs/whatsapp-template.mdx
goal: Open a WhatsApp template's Buttons field and show the Button Type options (one type per template)
steps:
  - goto: /en/${workspace}/templates
  - expect: {text: "Templates"}
  - click: {text: "${workflow_slug}"}
  - click: {text: "WhatsApp", exact: true}
  - expect: {text: "Buttons"}
  - click: {label: "Button Type"}
  - expect: {text: "Call to Action", exact: true}
  - expect: {text: "Quick Reply", exact: true}
  - expect: {text: "None", exact: true}
  - screenshot:
      out: images/whatsapp-template/button-type-dropdown.png
      highlight: {label: "Button Type"}
      alt: Button Type dropdown in the WhatsApp editor, open, showing Call to Action, Quick Reply and None
